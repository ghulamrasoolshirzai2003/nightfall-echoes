name: Daily Suno prompt

# Sends today's song prompt (style + lyrics) to your Telegram group. A team
# member pastes it into Suno, downloads the MP3, and replies with it in the
# same chat — poll_telegram.yml picks that up and builds the final video.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-prompt
  cancel-in-progress: false

jobs:
  send-prompt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements-telegram.txt

      - name: Send today's prompt to Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.send_daily_prompt

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/state.json
          git diff --staged --quiet || git commit -m "State: new daily prompt sent"
          git push
