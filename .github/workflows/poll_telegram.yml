name: Poll Telegram for finished song

# Telegram has no push-to-GitHub webhook, so we check every 5 min (GitHub
# Actions' minimum schedule interval) for a new MP3 reply. If one's there,
# builds the thumbnail + video and sends the finished video back to the
# group. Cheap and quick when there's nothing new. concurrency below queues
# (doesn't cancel) if a build from the previous tick is still running.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poll-telegram
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # Story-video builds (transcription + multi-scene fetch/render) take
    # longer than a quick check — generously budgeted, still cheap since
    # nothing runs unless a new MP3 actually showed up this cycle.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements-telegram.txt

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small

      - name: Check for a finished song and deliver it
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python -m src.poll_telegram

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/state.json
          git diff --staged --quiet || git commit -m "State: poll checkpoint"
          git push
