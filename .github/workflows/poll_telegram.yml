name: Poll Telegram for finished song

# Telegram has no push-to-GitHub webhook, so this checks periodically for a
# new MP3 reply. GitHub's own `schedule:` trigger turned out to be severely
# unreliable at high frequency in practice — measured gaps of 1-3.5 HOURS
# between "every 5 minute" runs, not minutes. GitHub deprioritizes frequent
# schedule triggers under load and gives no SLA on timing.
#
# Fix: self-chaining. Each run polls internally every ~45s for ~25 minutes
# (real near-real-time coverage, not dependent on the scheduler at all), then
# explicitly dispatches its own next run via the Actions API before exiting —
# workflow_dispatch is specifically exempted from GitHub's anti-recursion
# block on GITHUB_TOKEN, so this keeps the chain alive indefinitely.
#
# Every step below has its OWN timeout-minutes. Without that, a single stuck
# step (observed for real: `apt-get install` hung 18+ minutes on a flaky
# runner) can eat the whole job timeout before "Chain the next run" ever gets
# a chance to run — silently killing the chain with no recovery until the
# schedule backstop (itself unreliable) eventually fires. A short per-step
# timeout turns a hang into a fast failure, and "Chain the next run" has
# `if: always()` so it fires regardless of what failed above it — the chain
# self-heals from almost any single-step failure without needing anyone to
# notice and manually restart it.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: poll-telegram
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3

      - name: Install ffmpeg
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - uses: actions/setup-python@v5
        timeout-minutes: 5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements-telegram.txt
        timeout-minutes: 8

      - name: Cache Whisper model
        timeout-minutes: 5
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small

      - name: Poll every ~45s for ~25 minutes
        timeout-minutes: 30
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          end=$((SECONDS + 25*60))
          while [ $SECONDS -lt $end ]; do
            python -m src.poll_telegram || echo "[loop] iteration failed, continuing"
            git add state/state.json
            if ! git diff --staged --quiet; then
              git commit -m "State: poll checkpoint"
              # daily_prompt.yml can commit around the same time — a real
              # race between the two was observed in production (push
              # rejected). An unhandled failure here used to be able to kill
              # this whole 25-min loop early; retry instead.
              pushed=0
              for i in 1 2 3 4 5; do
                if git push; then pushed=1; break; fi
                echo "Push rejected (attempt $i), pulling and retrying..."
                git pull --rebase -X ours origin master
                sleep 3
              done
              [ "$pushed" = "1" ] || echo "[loop] state push failed after retries, continuing anyway"
            fi
            sleep 45
          done

      - name: Chain the next run
        if: always()
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            gh workflow run "Poll Telegram for finished song" --repo ${{ github.repository }} && exit 0
            echo "Dispatch attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "::warning::Failed to chain the next run after 3 attempts — the schedule backstop will eventually recover it."
