name: Poll Telegram for finished song

# Telegram has no push-to-GitHub webhook, so this checks periodically for a
# new MP3 reply. GitHub's own `schedule:` trigger turned out to be severely
# unreliable at high frequency in practice — measured gaps of 1-3.5 HOURS
# between "every 5 minute" runs, not minutes. GitHub deprioritizes frequent
# schedule triggers under load and gives no SLA on timing.
#
# Fix: self-chaining. Each run polls internally every ~45s for ~25 minutes
# (real near-real-time coverage, not dependent on the scheduler at all), then
# explicitly dispatches its own next run via the Actions API before exiting —
# workflow_dispatch is specifically exempted from GitHub's anti-recursion
# block on GITHUB_TOKEN, so this keeps the chain alive indefinitely. The
# `schedule:` trigger stays only as a resurrection safety net in case the
# chain ever breaks (e.g. a hard crash before the final dispatch step).
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: poll-telegram
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # ~25 min inner loop + generous buffer for a build that starts near the
    # end of that window (transcription + multi-scene fetch/render is slow).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements-telegram.txt

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small

      - name: Poll every ~45s for ~25 minutes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          end=$((SECONDS + 25*60))
          while [ $SECONDS -lt $end ]; do
            python -m src.poll_telegram || echo "[loop] iteration failed, continuing"
            git add state/state.json
            git diff --staged --quiet || (git commit -m "State: poll checkpoint" && git push)
            sleep 45
          done

      - name: Chain the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Poll Telegram for finished song" --repo ${{ github.repository }}
