name: Daily song

# System A (fully-automatic instrumental -> YouTube) — NOT the system in
# active use (that's "Daily Suno prompt" + "Poll Telegram for finished
# song"). Schedule disabled: this was failing every day since YT_REFRESH_TOKEN
# was never configured (System B was chosen instead), just cluttering the
# Actions history with red X's. Still manually runnable via workflow_dispatch
# if System A is ever wanted later — see SETUP.md Parts B/C to configure it.
on:
  workflow_dispatch:

# Prevent overlapping runs.
concurrency:
  group: daily-song
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache MusicGen model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: musicgen-small

      - name: Run the pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m src.pipeline

      - name: Save output as artifact (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-output
          path: output/*.mp4
          retention-days: 3
          if-no-files-found: ignore
